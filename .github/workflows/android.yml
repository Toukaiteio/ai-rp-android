name: Android Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AI_RP_KEYSTORE_BASE64: ${{ secrets.AI_RP_KEYSTORE_BASE64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: env.AI_RP_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.AI_RP_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"

      - name: Build signed release APK
        if: env.AI_RP_KEYSTORE_BASE64 != ''
        env:
          AI_RP_KEYSTORE: ${{ runner.temp }}/signing/release.jks
          AI_RP_STORE_PASSWORD: ${{ secrets.AI_RP_STORE_PASSWORD }}
          AI_RP_KEY_ALIAS: ${{ secrets.AI_RP_KEY_ALIAS }}
          AI_RP_KEY_PASSWORD: ${{ secrets.AI_RP_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        if: env.AI_RP_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
