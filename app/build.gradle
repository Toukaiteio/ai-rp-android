plugins { id "com.android.application" }

android {
    namespace "asia.dys.rp"
    compileSdk 35

    defaultConfig {
        applicationId "asia.dys.rp"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            def signingFile = providers.gradleProperty("androidKeystore").orElse(providers.environmentVariable("AI_RP_KEYSTORE")).get()
            storeFile file(signingFile)
            storePassword providers.gradleProperty("androidStorePassword").orElse(providers.environmentVariable("AI_RP_STORE_PASSWORD")).get()
            keyAlias providers.gradleProperty("androidKeyAlias").orElse(providers.environmentVariable("AI_RP_KEY_ALIAS")).get()
            keyPassword providers.gradleProperty("androidKeyPassword").orElse(providers.environmentVariable("AI_RP_KEY_PASSWORD")).get()
        }
    }

    buildTypes {
        release { minifyEnabled false }
        release { signingConfig signingConfigs.release }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
