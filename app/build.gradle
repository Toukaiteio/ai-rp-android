plugins { id "com.android.application" }

android {
    namespace "asia.dys.rp"
    compileSdk 35

    defaultConfig {
        applicationId "asia.dys.rp"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    def releaseKeystore = providers.gradleProperty("androidKeystore")
            .orElse(providers.environmentVariable("AI_RP_KEYSTORE"))

    signingConfigs {
        release {
            if (releaseKeystore.present) {
                storeFile file(releaseKeystore.get())
                storePassword providers.gradleProperty("androidStorePassword").orElse(providers.environmentVariable("AI_RP_STORE_PASSWORD")).get()
                keyAlias providers.gradleProperty("androidKeyAlias").orElse(providers.environmentVariable("AI_RP_KEY_ALIAS")).get()
                keyPassword providers.gradleProperty("androidKeyPassword").orElse(providers.environmentVariable("AI_RP_KEY_PASSWORD")).get()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore.present) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
