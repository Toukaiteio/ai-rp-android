plugins { id "com.android.application" }

android {
    namespace "asia.dys.rp"
    compileSdk 35

    defaultConfig {
        applicationId "asia.dys.rp"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
